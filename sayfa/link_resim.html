
<!DOCTYPE html>
<html>
<head>
    <style>
        a:link {
            color: red;
        }

        a:active {
            font-size: 16px;
            color: rgb(12, 216, 46);
        }

        img {
            width: 500px;
            height: 500px;
            float: left;
            transition: 0.5s;
        }

        img:hover {
            width: 200px;
            height: 200px;
            transform: translate(500px, 500px);
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <h1>Sayfa 2</h1>

    <a href="index.html">Ana Sayfa</a>

    <br>

    <img src="öpücük.png">
</body>
</html>
